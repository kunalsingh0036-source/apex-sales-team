<!DOCTYPE html>
<html>
<head><title>FHRAI Member Directory</title></head>
<body>
<form>
<table class="table table-bordered search_member_tb">
  <thead>
    <tr>
      <th><a id="LnkName" class="WH" href="javascript:__doPostBack('LnkName','')">Establishment Name</a></th>
      <th><a id="LnkCity" class="WH" href="javascript:__doPostBack('LnkCity','')">City</a></th>
      <th><a id="LnkCategory" class="WH" href="javascript:__doPostBack('LnkCategory','')">Category</a></th>
      <th>Website</th>
    </tr>
  </thead>
  <tbody>
    <!-- Empty separator row that FHRAI emits between data rows -->
    <tr></tr>

    <!-- Real data: name + city + category + website -->
    <tr>
      <td>
        <a href="javascript:void(0)" onclick="ViewInvoicedetails('guid-1');" style="border:none;color:black;">
          THE TAJ LAKE PALACE
        </a>
      </td>
      <td>Udaipur</td>
      <td>5 Star</td>
      <td><a href="https://www.tajhotels.com">Visit</a></td>
    </tr>

    <!-- Empty separator -->
    <tr></tr>

    <!-- Another row, no website link -->
    <tr>
      <td>
        <a href="javascript:void(0)" onclick="ViewInvoicedetails('guid-2');" style="border:none;color:black;">
          12TH AVENUE
        </a>
      </td>
      <td>Bengaluru</td>
      <td>Unclassified</td>
      <td></td>
    </tr>

    <tr></tr>

    <!-- Mixed-case name (already title-cased) — should NOT be re-normalized -->
    <tr>
      <td>
        <a href="javascript:void(0)" onclick="ViewInvoicedetails('guid-3');" style="border:none;color:black;">
          ITC Grand Chola Chennai
        </a>
      </td>
      <td>Chennai</td>
      <td>5 Star</td>
      <td><a href="https://www.itchotels.com">www.itchotels.com</a></td>
    </tr>

    <tr></tr>

    <!-- Edge case: empty name cell — must be skipped -->
    <tr>
      <td></td>
      <td>Mumbai</td>
      <td>Unclassified</td>
      <td></td>
    </tr>

    <tr></tr>

    <!-- Edge case: row with only one cell — must be skipped -->
    <tr>
      <td>Footer notice</td>
    </tr>

  </tbody>
</table>
</form>
</body>
</html>
